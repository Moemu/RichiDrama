app:
  name: RichiDrama API
  version: 1.0.0
  debug: true
  language: zh
server:
  port: 5679
  host: 0.0.0.0
  cors_origins:
    - http://localhost:3012
  read_timeout: 600
  write_timeout: 600
  insecure_tls: true
# ToC payments are opt-in. Supply all credentials with CFG_PAYMENTS__...
# environment variables. Never commit merchant keys to this file.
payments:
  enabled: false
  public_base_url: ''
  order_expire_minutes: 15
  min_amount_fen: 100
  max_amount_fen: 500000
  preset_amounts_fen: [1000, 5000, 10000, 50000]
  alipay:
    enabled: false
    endpoint: https://openapi.alipay.com/gateway.do
    app_id: ''
    app_private_key: ''
    alipay_public_key: ''
    seller_id: ''
    key_type: PKCS8
  wechat:
    enabled: false
    notify_url: ''
    app_id: ''
    mch_id: ''
    merchant_serial_no: ''
    merchant_private_key: ''
    api_v3_key: ''
    wechatpay_public_key_id: ''
    wechatpay_public_key: ''
    # Deprecated compatibility field. Use wechatpay_public_key.
    platform_public_key: ''
database:
  type: sqlite
  path: ./data/drama_generator.db
  max_idle: 10
  max_open: 100
storage:
  type: local
  local_path: ./data/storage
  base_url: http://localhost:5679/static
  # Set type to oss only after the dry-run migration succeeds. Keep all
  # credentials out of this file; use CFG_STORAGE__OSS__... environment vars.
  # oss:
  #   endpoint: https://oss-cn-hangzhou.aliyuncs.com
  #   bucket: your-private-or-public-bucket
  #   prefix: local-mini-drama
  #   public_base_url: https://media.example.com
  #   auto_archive_enabled: false
  #   # Local hot copies are pruned only after the matching private OSS object
  #   # has been verified as readable. Values are days and may also be set by
  #   # CFG_STORAGE__OSS__LOCAL_RETENTION_DAYS__VIDEO, etc.
  #   local_retention_days:
  #     video: 14
  #     image: 30
  #     audio: 30
  #     default: 30
# 异步视频任务轮询总超时（分钟）；省略或 ≤0 时默认 30
video:
  generation_timeout_minutes: 30
ai:
  default_text_provider: openai
  default_image_provider: openai
  default_video_provider: doubao
style:
  default_style: ''
  default_role_style: full body and face clearly visible, character centered, consistent facial features, high detail, masterpiece, best quality
  default_scene_style: wide establishing shot, highly detailed environment, sharp focus, rich atmosphere, masterpiece, best quality
  default_prop_style: object centered, clean simple background, studio lighting, sharp focus, high detail, masterpiece, best quality
  default_image_ratio: '16:9'
  default_video_ratio: '16:9'
  default_prop_ratio: '1:1'
  default_image_size: 1024x1024
vendor_lock:
  enabled: false
  config_file: ai-configs-qudao.json
image_proxy:
  expire_hours: 2   # 按图床实际 TTL 调整
  use_for_video: true
  # 图床上传超时（秒），避免网络不通时长时间卡住
  upload_timeout_seconds: 180
  upload_max_attempts: 2
  # upload_url: https://imageproxy.zhongzhuan.chat/api/upload
