# Preview edge: the ONLY component bridging the production ingress network
# and the isolated preview network. Untrusted preview code can reach this
# container, so it must never proxy anything except pr-<N> preview
# applications: every other Host gets a bare 404 before any upstream is
# consulted, which is what stops the container being used as a pivot into
# the production network.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

server {
    listen 8080;
    server_name "~^pr-(?<preview_pr>[0-9]+)\.preview\.drama\.richbest\.cn$";

    auth_basic "RichiDrama PR Preview";
    auth_basic_user_file /etc/nginx/minidrama-preview.htpasswd;

    location / {
        proxy_pass http://pr-$preview_pr:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 32m;
    }
}
