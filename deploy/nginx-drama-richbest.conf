# LocalMiniDrama 反向代理配置
# 通过域名 drama.richbest.cn 访问（80 端口）
# 反代到 lens-rhyme 网络中的 minidrama-app 容器（端口 5679）
server {
    listen 80;
    server_name drama.richbest.cn;

    # 允许上传较大素材（参考图/角色图等），与后端 multer 16MB 上限对齐并预留 multipart 封装开销
    # 缺省默认仅 1m，会导致大于 1MB 的上传被 nginx 直接以 413 拒绝
    client_max_body_size 20m;

    # 后端 API
    location /api/ {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频生成等异步任务耗时较长，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态素材（图片/视频/音频）
    location /static/ {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频文件可能较大
        proxy_read_timeout 300s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://minidrama-app:5679;
        proxy_set_header Host $http_host;
    }

    # 前端 SPA + 静态资源（assets/favicon 等）
    location / {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 兼容（如有需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
