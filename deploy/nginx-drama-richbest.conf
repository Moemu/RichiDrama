# RichiDrama 反向代理配置
# 通过域名 drama.richbest.cn 访问（80 端口）
# 反代到 lens-rhyme 网络中的 minidrama-app 容器（端口 5679）
server {
    listen 80;
    server_name drama.richbest.cn;

    # 允许上传较大素材（参考图/角色图等），与后端 multer 图片 30MB 上限对齐并预留 multipart 封装开销
    # 缺省默认仅 1m，会导致大于 1MB 的上传被 nginx 直接以 413 拒绝
client_max_body_size 32m;

    # 媒体上传（剧集视频等）后端已流式落盘，上限对齐 mediaAssetService.LIMITS.video=2048MB 并留 multipart 开销；
    # 2GB 慢传需要更长的发送/读取超时。仅这一个精确路径放宽，其余仍受 server 级 32m 约束。
    # proxy_request_buffering off：nginx 不再把请求体整体落盘（否则每并发需 ≥2.1GB client_body_temp 磁盘），
    # 直接流式转给后端 diskStorage；client_body_timeout 防止大包中途停顿被默认 60s 掐断。
    location = /api/v1/media/upload {
        client_max_body_size 2100m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频生成等异步任务耗时较长，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 静态素材（图片/视频/音频）
    location /static/ {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 视频文件可能较大
        proxy_read_timeout 300s;
        # Explicit CORS headers for media Range requests.
        add_header Access-Control-Allow-Origin 'http://drama.richbest.cn' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Content-Type, Origin, Accept' always;
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Accept-Ranges' always;
    }

    # 健康检查
    location = /health {
        proxy_pass http://minidrama-app:5679;
        proxy_set_header Host $http_host;
    }

    # Readiness includes SQLite, frontend and deployed revision checks.
    location = /ready {
        proxy_pass http://minidrama-app:5679;
        proxy_set_header Host $http_host;
    }

    # 前端 SPA + 静态资源（assets/favicon 等）
    location / {
        proxy_pass http://minidrama-app:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 兼容（如有需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
