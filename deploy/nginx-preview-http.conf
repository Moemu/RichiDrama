# Shared HTTP ingress for RichiDrama PR previews. Each preview application
# container joins the minidrama-previews Docker network with the alias
# pr-<number>, so this file never changes when previews are deployed or
# removed. Requests are authenticated and routed by preview number.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name "~^pr-(?<preview_pr>[0-9]+)\.preview\.drama\.richbest\.cn$";

    auth_basic "RichiDrama PR Preview";
    auth_basic_user_file /etc/nginx/minidrama-preview.htpasswd;

    location / {
        proxy_pass http://pr-$preview_pr:5679;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 32m;
    }
}

# Any other preview-zone hostname (malformed or not yet deployed) is rejected
# instead of falling through to the production server block.
server {
    listen 80;
    server_name "~^.*\.preview\.drama\.richbest\.cn$";
    return 404;
}
