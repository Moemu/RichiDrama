# Permanent HTTP entry point for ACME. Exact preview hosts add their own
# redirect after a certificate is issued.
server {
    listen 80;
    server_name .preview.drama.richbest.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/minidrama-acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
