# Installed into the shared port-80 ingress: forwards preview hostnames to
# the dedicated preview edge container. Deliberately WITHOUT basic auth —
# authentication is enforced once, on the edge, so this nginx never carries
# credentials and cannot be talked into proxying anywhere else.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name "~^pr-[0-9]+\.preview\.drama\.richbest\.cn$";

    location / {
        set $preview_edge_upstream http://minidrama-preview-edge:8080;
        proxy_pass $preview_edge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 32m;
    }
}

# Any other preview-zone hostname (malformed or not yet deployed) is rejected
# instead of falling through to the production server block.
server {
    listen 80;
    server_name "~^.*\.preview\.drama\.richbest\.cn$";
    return 404;
}
