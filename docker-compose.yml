services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-minidrama:latest
    container_name: local-minidrama
    restart: unless-stopped
    ports:
      # 宿主机端口 10588（内网调试/备用）→ 容器内 5679
      # 对外访问走 80 端口的 lens-rhyme-nginx，用域名 drama.richbest.cn
      - "10588:5679"
    volumes:
      # 数据与代码目录分离：SQLite 库 + 所有上传/生成素材。
      # 默认使用固定宿主机目录，避免重新克隆/替换仓库目录时丢失旧素材 ID。
      - ${MINIDRAMA_DATA_DIR:-/data/minidrama-data}:/app/backend-node/data
    # Deployment-only credentials stay in this ignored file. Compose otherwise
    # only loads `.env`, which left a valid `minidrama.oss.env` inactive.
    env_file:
      - ./minidrama.oss.env
    environment:
      - NODE_ENV=production
      - PORT=5679
      # Defaults preserve the existing local-storage deployment. Put real OSS
      # values in an untracked deployment env file, never in config.yaml.
      - CFG_STORAGE__TYPE=${MINIDRAMA_STORAGE_TYPE:-local}
      - CFG_STORAGE__OSS__ENDPOINT=${MINIDRAMA_OSS_ENDPOINT:-}
      - CFG_STORAGE__OSS__BUCKET=${MINIDRAMA_OSS_BUCKET:-}
      - CFG_STORAGE__OSS__ACCESS_KEY_ID=${MINIDRAMA_OSS_ACCESS_KEY_ID:-}
      - CFG_STORAGE__OSS__ACCESS_KEY_SECRET=${MINIDRAMA_OSS_ACCESS_KEY_SECRET:-}
      - CFG_STORAGE__OSS__PREFIX=${MINIDRAMA_OSS_PREFIX:-local-mini-drama}
      - CFG_STORAGE__OSS__PUBLIC_BASE_URL=${MINIDRAMA_OSS_CDN_DOMAIN:-}
      - CFG_STORAGE__OSS__AUTO_ARCHIVE_ENABLED=${MINIDRAMA_OSS_AUTO_ARCHIVE_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5679/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      default: {}
      # 加入 lens-rhyme 网络，使其 nginx 能通过容器名反代到本应用
      lens-rhyme:
        aliases:
          - minidrama-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lens-rhyme:
    external: true
    name: lens-rhyme_default
