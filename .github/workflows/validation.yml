name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install bounded test tools
        run: |
          sudo timeout 180s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo timeout 180s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends ffmpeg shellcheck
      - name: Check deployment shell scripts
        run: |
          shellcheck -e SC1091 \
            deploy/lib.sh deploy/preview-deploy deploy/preview-remove deploy/preview-show deploy/preview-cleanup \
            deploy/release-deploy deploy/release-rollback deploy/install-operations
      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        working-directory: backend-node
        run: node --test test/*.test.js
      - name: Verify empty database migrations twice
        working-directory: backend-node
        run: node tools/verify-migrations.js "${RUNNER_TEMP}/empty/drama_generator.db"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontweb/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontweb
        run: node --test test/*.test.js
      - name: Build frontend
        working-directory: frontweb
        run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: docker build --build-arg "APP_REVISION=${GITHUB_SHA}" -t "local-minidrama:${GITHUB_SHA}" .
      - name: Verify image revision
        run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "local-minidrama:${GITHUB_SHA}")" = "${GITHUB_SHA}"
      - name: Verify preview Nginx configuration
        run: |
          test_root="${RUNNER_TEMP}/preview-nginx"
          mkdir -p "$test_root"
          touch "$test_root/minidrama-preview.htpasswd"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/deploy/nginx-preview-http.conf:/etc/nginx/conf.d/minidrama-previews.conf:ro" \
            -v "${test_root}/minidrama-preview.htpasswd:/etc/nginx/minidrama-preview.htpasswd:ro" \
            nginx:1.27-alpine nginx -t
