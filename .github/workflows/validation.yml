name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install video test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg shellcheck
      - name: Check deployment shell scripts
        run: |
          shellcheck -e SC1091 \
            deploy/lib.sh deploy/preview-deploy deploy/preview-remove deploy/preview-show deploy/preview-cleanup \
            deploy/release-deploy deploy/release-rollback deploy/install-operations \
            deploy/acme-auth-hook.sh deploy/acme-cleanup-hook.sh
      - name: Install backend dependencies
        working-directory: backend-node
        run: npm ci --no-audit --no-fund
      - name: Run backend tests
        working-directory: backend-node
        run: node --test test/*.test.js
      - name: Verify empty database migrations twice
        working-directory: backend-node
        run: node tools/verify-migrations.js "${RUNNER_TEMP}/empty/drama_generator.db"

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontweb/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontweb
        run: node --test test/*.test.js
      - name: Build frontend
        working-directory: frontweb
        run: npm run build

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate image
        run: docker build --build-arg "APP_REVISION=${GITHUB_SHA}" -t "local-minidrama:${GITHUB_SHA}" .
      - name: Verify image revision
        run: test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "local-minidrama:${GITHUB_SHA}")" = "${GITHUB_SHA}"
      - name: Verify preview TLS Nginx configuration
        run: |
          host='pr-3-0123456789abcdef.preview.drama.richbest.cn'
          test_root="${RUNNER_TEMP}/preview-nginx"
          mkdir -p "${test_root}/live/${host}"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=${host}" \
            -keyout "${test_root}/live/${host}/privkey.pem" \
            -out "${test_root}/live/${host}/fullchain.pem" >/dev/null 2>&1
          sed -e "s/__PREVIEW_HOST__/${host}/g" -e 's/__GATEWAY_IP__/127.0.0.1/g' \
            deploy/nginx-preview-tls.conf.template > "${test_root}/preview.conf"
          docker run --rm \
            -v "${test_root}/preview.conf:/etc/nginx/conf.d/preview.conf:ro" \
            -v "${GITHUB_WORKSPACE}/deploy/nginx-tls-default-reject.conf:/etc/nginx/conf.d/00-minidrama-default-reject.conf:ro" \
            -v "${test_root}:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t
