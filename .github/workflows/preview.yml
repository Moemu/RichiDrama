name: PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open internal PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: preview-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Preview smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    steps:
      - name: Resolve and validate internal PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          data="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"$data")" = open
          test "$(jq -r .base.ref <<<"$data")" = main
          test "$(jq -r .head.repo.full_name <<<"$data")" = "$GITHUB_REPOSITORY"
          association="$(jq -r .author_association <<<"$data")"
          [[ "$association" == MEMBER || "$association" == COLLABORATOR || "$association" == OWNER ]]
          sha="$(jq -r .head.sha <<<"$data")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state=pending -f context='preview / smoke' -f description='Preview deployment is running' >/dev/null
      - name: Deploy isolated preview
        uses: appleboy/ssh-action@v1.2.0
        env:
          MINIDRAMA_ACME_EMAIL: ${{ vars.MINIDRAMA_ACME_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 40m
          envs: MINIDRAMA_ACME_EMAIL
          script: |
            set -euo pipefail
            sha='${{ steps.pr.outputs.sha }}'
            pr='${{ inputs.pr_number }}'
            repo='/data/apps/LocalMiniDrama'
            incoming="/data/minidrama-incoming/${sha}.tar.gz"
            bootstrap="/data/minidrama-bootstrap/${sha}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$pr" =~ ^[1-9][0-9]*$ ]]
            test -d "$repo/.git"
            mkdir -p /data/minidrama-incoming /data/minidrama-bootstrap
            timeout 180s git -C "$repo" fetch --no-tags origin "refs/pull/${pr}/head"
            test "$(git -C "$repo" rev-parse FETCH_HEAD)" = "$sha"
            git -C "$repo" archive --format=tar.gz --output="$incoming" "$sha"
            rm -rf "$bootstrap"
            mkdir -p "$bootstrap"
            tar -xzf "$incoming" -C "$bootstrap"
            bash "$bootstrap/deploy/preview-deploy" "$pr" "$sha"
      - name: Remove server-side source
        if: always() && steps.pr.outputs.sha != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            sha='${{ steps.pr.outputs.sha }}'
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            incoming="/data/minidrama-incoming/${sha}.tar.gz"
            bootstrap="/data/minidrama-bootstrap/${sha}"
            [[ "$(realpath -m "$incoming")" == "/data/minidrama-incoming/${sha}.tar.gz" ]]
            [[ "$(realpath -m "$bootstrap")" == "/data/minidrama-bootstrap/${sha}" ]]
            rm -f -- "$incoming"
            rm -rf -- "$bootstrap"
      - name: Mark preview successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=success -f context='preview / smoke' -f description='Approved preview passed' >/dev/null
      - name: Mark preview failed
        if: failure() && steps.pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state=failure -f context='preview / smoke' -f description='Preview deployment failed' >/dev/null
