name: Production Deploy

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Resolve release revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_run ]]; then sha="$WORKFLOW_SHA"; else sha="${GITHUB_SHA}"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 1
      - name: Package exact revision
        env:
          SHA: ${{ steps.revision.outputs.sha }}
        run: git archive --format=tar.gz --output="${SHA}.tar.gz" HEAD
      - name: Upload source archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: ${{ steps.revision.outputs.sha }}.tar.gz
          target: /data/minidrama-incoming
      - name: Deploy approved release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            sha='${{ steps.revision.outputs.sha }}'
            bootstrap="/data/minidrama-bootstrap/${sha}"
            rm -rf "$bootstrap"
            mkdir -p "$bootstrap"
            tar -xzf "/data/minidrama-incoming/${sha}.tar.gz" -C "$bootstrap"
            bash "$bootstrap/deploy/release-deploy" "$sha"
