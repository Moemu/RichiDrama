name: Preview Cleanup

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove closed PR preview
        if: github.event_name == 'pull_request_target'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: bash /data/apps/LocalMiniDrama/deploy/preview-remove '${{ github.event.pull_request.number }}'
      - name: Remove expired previews
        if: github.event_name != 'pull_request_target'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: bash /data/apps/LocalMiniDrama/deploy/preview-cleanup
